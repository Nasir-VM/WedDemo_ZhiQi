[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations", "static", "node_modules", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
"apps/audit/apps.py" = ["F401"]
"apps/core/apps.py" = ["F401"]
"config/settings_test.py" = ["F403", "F405"]
"scripts/concurrency_test.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations|static|node_modules"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py", "tests.py", "*_tests.py"]
testpaths = ["tests"]
