{% extends "base.html" %}
{% block title %}帳號暫時鎖定{% endblock %}
{% block content %}

    <h1 class="text-2xl font-bold text-rose-600 dark:text-rose-400">帳號暫時鎖定</h1>

</div>
{% endblock %}
