{% extends "base.html" %}
{% block title %}兩步驟驗證{% endblock %}
{% block content %}
<div class="mx-auto max-w-md py-10">
  <div class="card">
    <h1 class="text-xl font-bold">兩步驟驗證</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">請輸入驗證器 App 顯示的 6 位數代碼。</p>
    {% include "partials/form_errors.html" %}
    <form method="post" class="mt-4 space-y-4">
      {% csrf_token %}
      {% for field in form %}{% include "partials/field.html" with field=field %}{% endfor %}
      <button type="submit" class="btn-primary w-full">驗證並登入</button>
    </form>
    <form method="post" action="{% url 'accounts:logout' %}" class="mt-3 text-center">
      {% csrf_token %}
      <button type="submit" class="text-sm text-slate-500 hover:underline dark:text-slate-400">取消登入</button>
    </form>
  </div>
</div>
{% endblock %}
